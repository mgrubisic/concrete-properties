[project]
name = "concreteproperties"
version = "0.8.0"
description = "A python package to determine cross-section propreties of reinforced concrete sections."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    { name = "Robbie van Leeuwen", email = "robbie.vanleeuwen@gmail.com" }
]
maintainers = [
   { name = "Robbie van Leeuwen", email = "robbie.vanleeuwen@gmail.com" }
]
keywords = [
    "concrete",
    "reinforced-concrete",
    "prestressed-concrete",
    "post-tensioned-concrete",
    "cross-section",
    "structural-engineering",
    "finite-element-analysis",
    "computational-mechanics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = [
    "sectionproperties",
    "numpy",
    "scipy",
    "matplotlib",
    "shapely",
    "cytriangle",
    "rich[jupyter]",
    "more-itertools",
    "quantiphy",
]

[project.urls]
Homepage = "https://concrete-properties.readthedocs.io"
Documentation = "https://concrete-properties.readthedocs.io"
Repository = "https://github.com/robbievanleeuwen/concrete-properties"
Issues = "https://github.com/robbievanleeuwen/concrete-properties/issues"
Changelog = "https://github.com/robbievanleeuwen/concrete-properties/releases"

[dependency-groups]
dev = [
    "ipympl==0.10.0",
    "notebook==7.6.0",
    "sphinx-autobuild==2025.8.25",
]
docs = [
    "furo==2025.12.19",
    "sphinx==9.1.0",
    "ipykernel==7.3.0",
    "ipython==9.15.0",
    "nbsphinx==0.9.8",
    "nbconvert==7.17.1",
    "sphinx-copybutton==0.5.2",
    "sphinxext-opengraph==0.13.0",
]
lint = [
    "pre-commit==4.6.0",
    "pyright==1.1.411",
]
test = [
    "pytest==9.1.1",
    "pytest-check==2.8.0",
    "coverage[toml]==7.15.0",
]

[tool.uv]
default-groups = ["dev", "docs", "lint", "test"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
include = ["src"]
exclude = ["**/__init__.py"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["concreteproperties", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
